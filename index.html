
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura AI - Your Ultimate Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #020617;
            color: white;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        @keyframes aura-pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        }
        .aura-orb {
            animation: aura-pulse 3s infinite ease-in-out;
            background: radial-gradient(circle, #3b82f6 0%, #8b5cf6 100%);
        }
        
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 3D Transform for Login Card */
        .perspective-1000 {
            perspective: 1000px;
        }
        .rotate-x-12 {
            transform: rotateX(12deg);
        }
    </style>
<script type="importmap">

</body>
</html>
